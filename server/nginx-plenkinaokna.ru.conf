server {
    server_name plenkinaokna.ru;

    listen [::]:443 ssl http2;
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/plenkinaokna.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plenkinaokna.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.plenkinaokna.ru$request_uri;
}

server {
    server_name www.plenkinaokna.ru;

    root /var/www/plenkin;
    index index.html;
    charset utf-8;

        # === 301: старый сайт (Vercel/Next) -> новый (2026-09-01) ===
        # Старый блог (слаги без .html) -> новые статьи/услуги
        rewrite ^/blog/zashchita-okon-ot-bpla/?$  /uslugi/bpla.html permanent;
        rewrite ^/blog/smart-plenki-pdlc/?$       /uslugi/dekor.html permanent;
        rewrite ^/blog/klassy-zashchity-plenki/?$ /blog/k4-ili-r2a.html permanent;
        rewrite ^/blog/gid-plenka-dlya-shkoly/?$  /uslugi/shkoly.html permanent;
        rewrite ^/blog/normativnaya-baza-gost/?$  /blog/dokumenty-mchs.html permanent;
        rewrite ^/blog/atermalnaya-vs-zerkalnaya/?$ /blog/tonirovka-i-atermalnaya.html permanent;
        rewrite ^/blog/gid-broneplenka-bank/?$    /blog/chto-takoe-broneplenka.html permanent;
        rewrite ^/blog/gid-brendirovanie-ofisa/?$ /blog/plenka-dlya-ofisa.html permanent;
        rewrite ^/blog/branding-ofisa-plenkoy/?$  /blog/plenka-dlya-ofisa.html permanent;
        rewrite ^/blog/diy-vs-professional/?$     /blog/samostoyatelnyy-montazh.html permanent;
        rewrite ^/blog/gid-plenka-kvartira/?$     /uslugi/tonirovka-okon.html permanent;
        rewrite ^/blog/antigraffiti-antivandal/?$ /uslugi/zashchitnaya-plenka.html permanent;
        rewrite ^/blog/gid-solncezashchita-ofis/?$ /uslugi/atermalnaya.html permanent;
        # Старый раздел услуг
        rewrite ^/services/?$        / permanent;
        rewrite ^/services/solar/?$     /uslugi/atermalnaya.html permanent;
        rewrite ^/services/decorative/?$ /uslugi/dekor.html permanent;
        rewrite ^/services/protective/?$ /uslugi/zashchitnaya-plenka.html permanent;
        rewrite ^/services/plotter/?$    /uslugi/dekor.html permanent;
        rewrite ^/services/smart/?$      /uslugi/dekor.html permanent;
        rewrite ^/services/photo-print/?$ /uslugi/dekor.html permanent;
        rewrite ^/services/branding/?$   /uslugi/dekor.html permanent;
        rewrite ^/services/privacy\.html/?$ /privacy.html permanent;
        rewrite ^/services/blog(/.*)?$  /blog/ permanent;
        # Прочие старые страницы
        rewrite ^/contacts?/?$  / permanent;
        rewrite ^/contactus/?$  / permanent;
        rewrite ^/contact-us/?$ / permanent;
        rewrite ^/privacy/?$    /privacy.html permanent;
        rewrite ^/portfolio/?$  / permanent;
        rewrite ^/about/?$      / permanent;
        rewrite ^/price/?$      /ceny.html permanent;
        # Каталог услуг без index-файла
        location = /uslugi { return 301 /; }
        location = /uslugi/ { return 301 /; }


    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;

    location ~* \.(js|css|png|jpg|jpeg|svg|ico|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl http2;
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/plenkinaokna.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plenkinaokna.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = plenkinaokna.ru) {
        return 301 https://www.plenkinaokna.ru$request_uri;
    }
    if ($host = www.plenkinaokna.ru) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name plenkinaokna.ru www.plenkinaokna.ru;
    return 404;
}
